name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/atlas-native/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        working-directory: apps/atlas-native
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign APK for the TV
        id: signing
        if: github.ref_type == 'tag'
        working-directory: apps/atlas-native
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ATLAS_KEYSTORE_BASE64"
          test -n "$ATLAS_KEYSTORE_PASSWORD"
          test -n "$ATLAS_KEY_ALIAS"
          test -n "$ATLAS_KEY_PASSWORD"

          keystore="$RUNNER_TEMP/atlas-release.keystore"
          signed_apk="$RUNNER_TEMP/atlas-native-android11-armv7.apk"
          printf '%s' "$ATLAS_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ATLAS_KEY_ALIAS" \
            --ks-pass env:ATLAS_KEYSTORE_PASSWORD \
            --key-pass env:ATLAS_KEY_PASSWORD \
            --out "$signed_apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$signed_apk"
          rm -f "$keystore"
          echo "apk_path=$signed_apk" >> "$GITHUB_OUTPUT"

      - name: Prepare APK artifact
        id: package
        working-directory: apps/atlas-native
        env:
          ATLAS_SIGNED_APK: ${{ steps.signing.outputs.apk_path }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/atlas-apk"
          mkdir -p "$output"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            apk="$ATLAS_SIGNED_APK"
            name="atlas-native-android11-armv7.apk"
          else
            apk="app/build/outputs/apk/release/app-release-unsigned.apk"
            name="atlas-native-android11-armv7-unsigned.apk"
          fi
          cp "$apk" "$output/$name"
          (cd "$output" && sha256sum "$name" > "$name.sha256")
          echo "directory=$output" >> "$GITHUB_OUTPUT"
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: atlas-apk-${{ github.run_id }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish signed GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-apk-${{ github.run_id }}
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(release-assets/*.apk release-assets/*.sha256)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
